<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm History - Professional Monitoring</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        .layout-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .overlay.active {
            display: block;
        }

        /* Alert Panel */
        .alert-panel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 480px;
            height: 100vh;
            background: var(--surface);
            box-shadow: -10px 0 25px -5px rgb(0 0 0 / 0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 101;
            display: flex;
            flex-direction: column;
        }

        .alert-panel.open {
            transform: translateX(-480px);
        }

        .panel-header {
            padding: 1.5rem;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .panel-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f1f5f9;
        }

        .panel-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .alert-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--danger);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        .alert-card.severity-1 {
            border-left-color: var(--warning);
        }

        .alert-card.severity-2 {
            border-left-color: #f97316;
        }

        .alert-card.severity-3 {
            border-left-color: var(--danger);
        }

        /* Main Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .alert-trigger {
            position: relative;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-main);
            box-shadow: var(--shadow);
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 9999px;
            border: 2px solid white;
        }

        /* Filters */
        .filters-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        /* Table */
        .main-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            padding: 1.5rem;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            padding: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--secondary);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        tr:hover {
            background: #f8fafc;
        }

        .severity-tag {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .sev-1 {
            background: #fef3c7;
            color: #92400e;
        }

        .sev-2 {
            background: #ffedd5;
            color: #9a3412;
        }

        .sev-3 {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="overlay" id="overlay" onclick="closeAlertPanel()"></div>

    <!-- Alert Panel -->
    <div class="alert-panel" id="alertPanel">
        <div class="panel-header">
            <h2 style="font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="bell-ring"></i> Active Alerts
            </h2>
            <button class="panel-close" onclick="closeAlertPanel()">
                <i data-lucide="x" style="width: 18px"></i>
            </button>
        </div>
        <div class="panel-content" id="panelContent">
            <div style="text-align: center; color: var(--secondary); padding: 2rem;">No active alerts trace.</div>
        </div>
        <div class="panel-footer">
            <button class="btn btn-primary" style="width: 100%" onclick="clearAllAlerts()">
                <i data-lucide="check-check"></i> Clear All Alerts
            </button>
        </div>
    </div>

    <div class="layout-container">
        <header class="header">
            <h1><i data-lucide="database"></i> Alarm History & Monitoring</h1>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="btn alert-trigger" onclick="toggleAlertPanel()">
                    <i data-lucide="bell"></i> Notifications
                    <span class="badge" id="alertBadge">0</span>
                </button>
                <a href="index.html" class="btn btn-outline">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
            </div>
        </header>

        <!-- Filters -->
        <section class="filters-card">
            <div class="filter-group">
                <label>Source / Tag</label>
                <input type="text" id="filterSourceName" placeholder="e.g. Tank_01">
            </div>
            <div class="filter-group">
                <label>Severity Level</label>
                <select id="filterSeverity">
                    <option value="">All Severities</option>
                    <option value="1">Low (1)</option>
                    <option value="2">Medium (2)</option>
                    <option value="3">Critical (3)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>From Date</label>
                <input type="datetime-local" id="filterFromDate">
            </div>
            <div class="filter-group">
                <label>To Date</label>
                <input type="datetime-local" id="filterToDate">
            </div>
            <div style="display: flex; gap: 0.5rem">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <i data-lucide="search" style="width: 16px"></i> Filter
                </button>
                <button class="btn btn-outline" onclick="clearFilters()">Reset</button>
            </div>
        </section>

        <main class="main-card">
            <div id="status" style="text-align: center; padding: 3rem; color: var(--secondary);">
                <i data-lucide="refresh-cw" class="animate-spin"></i> Initializing historian...
            </div>

            <div class="table-container">
                <table id="alarmTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Occurrence Time</th>
                            <th>Alarm Message</th>
                            <th>Sev</th>
                            <th>Source Tag</th>
                            <th>Category</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="alarmBody"></tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination" style="display: none;">
                <div style="font-size: 0.875rem; color: var(--text-muted);" id="paginationInfo">Showing 0 - 0 of 0</div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <select id="pageSize" onchange="changePageSize(this.value)"
                        style="padding: 0.4rem; border-radius: 0.375rem; border: 1px solid var(--border);">
                        <option value="5">5 / page</option>
                        <option value="10" selected>10 / page</option>
                    </select>
                    <div style="display: flex; gap: 0.5rem">
                        <button class="btn btn-outline" onclick="previousPage()" id="prevBtn" disabled>
                            <i data-lucide="chevron-left" style="width: 16px"></i>
                        </button>
                        <button class="btn btn-outline" onclick="nextPage()" id="nextBtn">
                            <i data-lucide="chevron-right" style="width: 16px"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const POLL_INTERVAL = 5000;
        const STORAGE_KEY = 'unclearedAlarms';

        let lastCheckTime = null;
        let unclearedAlarms = new Map();
        let allAlarms = [];
        let filteredAlarms = [];
        let seenAlarmIds = new Set();

        let currentPage = 1;
        let currentPageSize = 10;
        let totalPages = 1;

        function loadUnclearedAlarms() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const alarms = JSON.parse(stored);
                    alarms.forEach(alarm => unclearedAlarms.set(alarm.eventID, alarm));
                    updateAlertPanel();
                } catch (e) { console.error('Storage error:', e); }
            }
        }

        function saveUnclearedAlarms() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(unclearedAlarms.values())));
        }

        function updateAlertPanel() {
            const panelContent = document.getElementById('panelContent');
            const badge = document.getElementById('alertBadge');
            const count = unclearedAlarms.size;

            badge.textContent = count;
            if (count === 0) {
                panelContent.innerHTML = '<div style="text-align: center; color: var(--secondary); padding: 2rem;">No active alerts trace.</div>';
                return;
            }

            panelContent.innerHTML = '';
            unclearedAlarms.forEach((alarm, eventID) => {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert-card severity-${alarm.severity || 2}`;

                const date = alarm.eventTimeStamp ? new Date(alarm.eventTimeStamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : 'N/A';

                alertDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted)">OCCURRED: ${date}</span>
                        <button class="btn btn-outline" style="padding: 0.25rem; border-radius: 4px" onclick="clearAlert('${eventID}')">
                            <i data-lucide="x" style="width: 14px; height: 14px"></i>
                        </button>
                    </div>
                    <div style="font-weight: 600; font-size: 0.9375rem; margin-bottom: 0.5rem; color: var(--primary)">${alarm.message || 'System Notification'}</div>
                    <div style="font-size: 0.8125rem; color: var(--text-muted)">
                        <strong>Source:</strong> ${alarm.sourceName || 'General'}<br>
                        <strong>Category:</strong> ${alarm.eventCategory || 'Uncategorized'}
                    </div>
                `;
                panelContent.appendChild(alertDiv);
            });
            lucide.createIcons();
        }

        function addNewAlert(alarm) {
            if (!unclearedAlarms.has(alarm.eventID)) {
                unclearedAlarms.set(alarm.eventID, alarm);
                updateAlertPanel();
                saveUnclearedAlarms();
                if (alarm.sourceName) syncTagFromAlarm(alarm.sourceName);
            }
        }

        function clearAlert(eventID) {
            unclearedAlarms.delete(eventID);
            updateAlertPanel();
            saveUnclearedAlarms();
        }

        function clearAllAlerts() {
            if (unclearedAlarms.size === 0) return;
            if (confirm('Acknowledge and clear all active alerts?')) {
                unclearedAlarms.clear();
                updateAlertPanel();
                saveUnclearedAlarms();
            }
        }

        function toggleAlertPanel() {
            document.getElementById('alertPanel').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function closeAlertPanel() {
            document.getElementById('alertPanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        async function syncTagFromAlarm(sourceName) {
            try {
                const apiBase = window.location.origin;
                await fetch(`${apiBase}/api/tags/sync-from-alarm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sourceName)
                });
            } catch (e) { console.error('Sync error:', e); }
        }

        async function fetchAlarms(apiUrl, since = null, page = 1, size = 10) {
            let url = apiUrl;
            if (since) url += `?since=${since.toISOString()}`;
            else url += `?pageNumber=${page}&pageSize=${size}`;

            const response = await fetch(url);
            if (!response.ok) throw new Error(`Status: ${response.status}`);
            return await response.json();
        }

        function applyFilters() {
            const sName = document.getElementById('filterSourceName').value.toLowerCase();
            const sev = document.getElementById('filterSeverity').value;
            const from = document.getElementById('filterFromDate').value;
            const to = document.getElementById('filterToDate').value;

            filteredAlarms = allAlarms.filter(a => {
                if (sName && !(a.sourceName || '').toLowerCase().includes(sName)) return false;
                if (sev && a.severity != sev) return false;
                if (from && new Date(a.eventTimeStamp) < new Date(from)) return false;
                if (to && new Date(a.eventTimeStamp) > new Date(to)) return false;
                return true;
            });
            updateTable(filteredAlarms);
        }

        function clearFilters() {
            document.querySelectorAll('.filters-card input, .filters-card select').forEach(el => el.value = '');
            filteredAlarms = allAlarms;
            updateTable(filteredAlarms);
        }

        function updateTable(alarms) {
            const tbody = document.getElementById('alarmBody');
            tbody.innerHTML = '';

            if (!alarms || alarms.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 3rem;">No records found for current criteria.</td></tr>';
                return;
            }

            alarms.forEach(a => {
                const tr = document.createElement('tr');
                const date = a.eventTimeStamp ? new Date(a.eventTimeStamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'medium' }) : '—';
                const sevClass = `sev-${a.severity || 1}`;

                tr.innerHTML = `
                    <td style="font-size: 0.8125rem; color: var(--text-muted)">${date}</td>
                    <td style="font-weight: 500">${a.message || '—'}</td>
                    <td><span class="severity-tag ${sevClass}">${a.severity || 0}</span></td>
                    <td style="font-weight: 600; color: var(--primary)">${a.sourceName || '—'}</td>
                    <td style="color: var(--secondary)">${a.eventCategory || '—'}</td>
                    <td>
                        <span style="color: ${a.active ? 'var(--danger)' : 'var(--success)'}; font-weight: 600">
                            ${a.active ? 'ACTIVE' : 'RESOLVED'}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function initialFetchAlarms() {
            const statusDiv = document.getElementById('status');
            const table = document.getElementById('alarmTable');
            const pagination = document.getElementById('pagination');

            try {
                const result = await fetchAlarms(`${window.location.origin}/api/alarms`, null, currentPage, currentPageSize);
                allAlarms = result.data;
                filteredAlarms = result.data;
                totalPages = result.totalPages;

                result.data.forEach(a => seenAlarmIds.add(a.eventID));

                statusDiv.style.display = 'none';
                table.style.display = 'table';
                pagination.style.display = 'flex';

                updateTable(filteredAlarms);
                updatePaginationInfo(result);
                lastCheckTime = new Date();
                lucide.createIcons();
            } catch (e) {
                statusDiv.innerHTML = `<div class="btn-danger" style="padding: 1rem; border-radius: 0.5rem">Error connecting to historian vault.</div>`;
            }
        }

        function updatePaginationInfo(result) {
            const start = result.totalCount === 0 ? 0 : (result.pageNumber - 1) * result.pageSize + 1;
            const end = Math.min(result.pageNumber * result.pageSize, result.totalCount);
            document.getElementById('paginationInfo').textContent = `Showing index ${start} - ${end} of ${result.totalCount} entries`;
            document.getElementById('prevBtn').disabled = !result.hasPreviousPage;
            document.getElementById('nextBtn').disabled = !result.hasNextPage;
        }

        function previousPage() { if (currentPage > 1) { currentPage--; initialFetchAlarms(); } }
        function nextPage() { if (currentPage < totalPages) { currentPage++; initialFetchAlarms(); } }
        function changePageSize(size) { currentPageSize = parseInt(size); currentPage = 1; initialFetchAlarms(); }

        async function pollForNewAlarms(apiUrl) {
            try {
                if (!lastCheckTime) return;
                const newAlarms = await fetchAlarms(apiUrl, lastCheckTime);
                if (newAlarms.length > 0) {
                    const trulyNew = newAlarms.filter(a => !seenAlarmIds.has(a.eventID));
                    if (trulyNew.length > 0) {
                        trulyNew.forEach(a => { addNewAlert(a); seenAlarmIds.add(a.eventID); });
                        allAlarms = [...trulyNew, ...allAlarms];
                        filteredAlarms = allAlarms;
                        updateTable(filteredAlarms);
                    }
                }
                lastCheckTime = new Date();
            } catch (e) { }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            loadUnclearedAlarms();
            await initialFetchAlarms();
            setInterval(() => pollForNewAlarms(`${window.location.origin}/api/alarms`), POLL_INTERVAL);
            lucide.createIcons();
        });
    </script>
</body>

</html>
